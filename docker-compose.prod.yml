name: anon-prod

services:
  # 内嵌数据库（零依赖体验模式）：FerretDB v2 + PostgreSQL(DocumentDB 扩展)。
  # 生产部署建议外接 MongoDB：在根目录 .env 设置 MONGO_URI 后，postgres/ferretdb 两个服务可删除或不启动。
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-anon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-anon-dev-password}
      POSTGRES_DB: postgres
    # 不暴露宿主机端口，仅编排网络内可见
    volumes:
      - pg-data:/var/lib/postgresql/data

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2
    restart: unless-stopped
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${DB_USER:-anon}:${DB_PASSWORD:-anon-dev-password}@postgres:5432/postgres
    # 不暴露宿主机端口，仅编排网络内可见
    depends_on:
      - postgres

  backend:
    build: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 不暴露宿主机端口，由 frontend 经 nginx 代理 /api 访问
    environment:
      # 外接 MongoDB 优先：设置了 MONGO_URI 则用之，否则用内嵌 ferretdb 服务
      MONGO_URI: ${MONGO_URI:-mongodb://${DB_USER:-anon}:${DB_PASSWORD:-anon-dev-password}@ferretdb:27017/anon}
      JWT_SECRET: ${JWT_SECRET:?请先在根目录 .env 或环境变量中设置 JWT_SECRET}
      PORT: 4000
      UPLOAD_DIR: uploads
      CRON_SECRET: ${CRON_SECRET:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PLATFORM_CRYPTO_KEY: ${PLATFORM_CRYPTO_KEY:-}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - ferretdb

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pg-data:
  uploads-data:
