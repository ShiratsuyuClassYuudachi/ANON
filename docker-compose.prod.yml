name: anon-prod

services:
  # 内嵌数据库（零依赖体验模式）：FerretDB v2 + PostgreSQL(DocumentDB 扩展)。
  # 生产部署建议外接 MongoDB：在根目录 .env 设置 MONGO_URI 后，postgres/ferretdb 两个服务可删除或不启动。
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-anon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-anon-dev-password}
      POSTGRES_DB: postgres
    # 不暴露宿主机端口，仅编排网络内可见
    volumes:
      - pg-data:/var/lib/postgresql/data

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2
    restart: unless-stopped
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${DB_USER:-anon}:${DB_PASSWORD:-anon-dev-password}@postgres:5432/postgres
    # 不暴露宿主机端口，仅编排网络内可见
    depends_on:
      - postgres

  # 内嵌对象存储（MinIO，S3 兼容 API）：物料/凭证等文件默认存这里。
  # 如需用外部 S3（阿里云 OSS / AWS S3 等），在根目录 .env 覆盖 S3_* 变量即可；
  # 设 S3_ENDPOINT= 为空则回退本地磁盘存储（uploads 卷），minio 服务可不启动。
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-anon-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-anon-minio-password}
    # 不暴露宿主机端口（API :9000 / 控制台 :9001 仅编排网络内可见）
    volumes:
      - minio-data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 不暴露宿主机端口，由 frontend 经 nginx 代理 /api 访问
    environment:
      # 外接 MongoDB 优先：设置了 MONGO_URI 则用之，否则用内嵌 ferretdb 服务
      MONGO_URI: ${MONGO_URI:-mongodb://${DB_USER:-anon}:${DB_PASSWORD:-anon-dev-password}@ferretdb:27017/anon}
      JWT_SECRET: ${JWT_SECRET:?请先在根目录 .env 或环境变量中设置 JWT_SECRET}
      PORT: 4000
      UPLOAD_DIR: uploads
      CRON_SECRET: ${CRON_SECRET:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      TRIAL_EMAIL: ${TRIAL_EMAIL-admin@test.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PLATFORM_CRYPTO_KEY: ${PLATFORM_CRYPTO_KEY:-}
      # 对象存储（S3）：默认指向编排内 minio；S3_ENDPOINT= 置空回退本地磁盘
      S3_ENDPOINT: ${S3_ENDPOINT-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-anon-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-anon-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-anon-minio-password}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - ferretdb
      - minio

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - backend

volumes:
  pg-data:
  uploads-data:
  minio-data:
