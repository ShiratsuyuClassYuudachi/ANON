name: anon-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # 不暴露宿主机端口，仅编排网络内可见
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    # 不暴露宿主机端口，由 frontend 经 nginx 代理 /api 访问
    environment:
      MONGO_URI: mongodb://mongo:27017/anon
      JWT_SECRET: ${JWT_SECRET:?请先在根目录 .env 或环境变量中设置 JWT_SECRET}
      PORT: 4000
      UPLOAD_DIR: uploads
      CRON_SECRET: ${CRON_SECRET:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PLATFORM_CRYPTO_KEY: ${PLATFORM_CRYPTO_KEY:-}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  uploads-data:
