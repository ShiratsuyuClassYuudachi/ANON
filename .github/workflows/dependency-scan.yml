name: dependency-scan

on:
  push:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - 'osv-scanner.toml'
      - '.github/workflows/dependency-scan.yml'
  schedule:
    # 每周一 03:00 UTC 全量兜底（新披露漏洞即使锁文件不变也会被扫到）
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 osv-scanner v2.4.0（SHA256 校验）
        run: |
          curl -sSL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          SUM=$(curl -sSL https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_SHA256SUMS \
            | awk '$2 == "osv-scanner_linux_amd64" { print $1 }')
          echo "$SUM  /usr/local/bin/osv-scanner" | sha256sum -c -
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: 扫描依赖（backend + frontend 锁文件）
        # 发现漏洞时命令以非 0 退出 → job 失败；豁免项见 osv-scanner.toml（附原因）
        run: |
          osv-scanner scan source --recursive --config=osv-scanner.toml backend frontend
